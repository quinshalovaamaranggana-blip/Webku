
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at top, #26345f, #101426 65%);
      padding: 30px 16px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 38px);
      letter-spacing: -1px;
    }

    header p {
      color: #aab5d0;
      margin-top: 8px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px 8px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat span {
      display: block;
      font-size: 12px;
      color: #aab5d0;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 23px;
      color: #fff;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      perspective: 800px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: linear-gradient(145deg, #7c6cff, #5545d6);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      color: white;
      font-size: clamp(20px, 5vw, 30px);
      transition: filter 0.2s, box-shadow 0.2s;
    }

    .card:hover .card-front {
      filter: brightness(1.15);
      box-shadow: 0 7px 24px rgba(124,108,255,0.3);
    }

    .card-back {
      transform: rotateY(180deg);
      background: #f8fafc;
      border: 2px solid #c7d2fe;
      font-size: clamp(27px, 7vw, 42px);
    }

    .card.matched .card-back {
      background: #d1fae5;
      border-color: #34d399;
      animation: match 0.35s ease;
    }

    .card:disabled {
      cursor: default;
    }

    @keyframes match {
      50% { scale: 1.08; }
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .restart {
      border: none;
      border-radius: 12px;
      padding: 13px 24px;
      background: #a99cff;
      color: #17152f;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .restart:hover {
      transform: translateY(-2px);
      background: #c4bbff;
    }

    .message {
      text-align: center;
      min-height: 28px;
      margin-top: 18px;
      color: #a5f3d0;
      font-weight: 600;
    }

    footer {
      text-align: center;
      color: #7f8bab;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 420px) {
      body { padding: 24px 12px; }
      .game-board { gap: 8px; }
      .card-face { border-radius: 12px; }
      .stat { padding: 12px 5px; }
      .stat strong { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">🧠</div>
      <h1>Memory Match</h1>
      <p>Temukan 10 pasangan kartu yang sama!</p>
    </header>

    <section class="stats" aria-label="Statistik permainan">
      <div class="stat">
        <span>⏱ Waktu</span>
        <strong id="timer">00:00</strong>
      </div>
      <div class="stat">
        <span>👆 Langkah</span>
        <strong id="moves">0</strong>
      </div>
      <div class="stat">
        <span>🎯 Pasangan</span>
        <strong id="pairs">0/10</strong>
      </div>
    </section>

    <section
      class="game-board"
      id="gameBoard"
      aria-label="Papan permainan memory card"
    ></section>

    <div class="message" id="message" aria-live="polite">
      Ayo mulai dan uji ingatanmu!
    </div>

    <div class="actions">
      <button class="restart" id="restart">↻ Mulai Ulang</button>
    </div>

    <footer>Memory Match · Latih ingatanmu setiap hari ✨</footer>
  </main>

  <script>
    const symbols = [
      "🚀", "🪐", "🌙", "⭐", "☄️",
      "👽", "🛸", "🌍", "🌌", "🛰️"
    ];

    const board = document.getElementById("gameBoard");
    const timerDisplay = document.getElementById("timer");
    const movesDisplay = document.getElementById("moves");
    const pairsDisplay = document.getElementById("pairs");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let moves = 0;
    let matchedPairs = 0;
    let seconds = 0;
    let timerInterval = null;
    let started = false;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function startTimer() {
      if (started) return;
      started = true;

      timerInterval = setInterval(() => {
        seconds++;
        timerDisplay.textContent = formatTime(seconds);
      }, 1000);
    }

    function createCard(symbol, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.dataset.symbol = symbol;
      card.setAttribute("aria-label", `Kartu ${index + 1}, tertutup`);

      card.innerHTML = `
        <span class="card-inner">
          <span class="card-face card-front" aria-hidden="true">?</span>
          <span class="card-face card-back" aria-hidden="true">${symbol}</span>
        </span>
      `;

      card.addEventListener("click", () => flipCard(card));
      return card;
    }

    function flipCard(card) {
      if (
        locked ||
        card === firstCard ||
        card.classList.contains("matched") ||
        card.classList.contains("flipped")
      ) return;

      startTimer();
      card.classList.add("flipped");
      card.setAttribute("aria-label", `Kartu ${card.dataset.symbol}`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves++;
      movesDisplay.textContent = moves;

      if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.disabled = true;
        secondCard.disabled = true;

        matchedPairs++;
        pairsDisplay.textContent = `${matchedPairs}/10`;
        message.textContent = "✨ Hebat! Kamu menemukan pasangan.";

        resetTurn();

        if (matchedPairs === symbols.length) {
          clearInterval(timerInterval);
          message.textContent =
            `🏆 Kamu menang dalam ${formatTime(seconds)} dengan ${moves} langkah!`;
        }
      } else {
        locked = true;
        message.textContent = "Belum cocok, coba ingat posisinya!";

        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");

          firstCard.setAttribute("aria-label", "Kartu tertutup");
          secondCard.setAttribute("aria-label", "Kartu tertutup");

          resetTurn();
        }, 850);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      locked = false;
    }

    function initGame() {
      clearInterval(timerInterval);

      firstCard = null;
      secondCard = null;
      locked = false;
      moves = 0;
      matchedPairs = 0;
      seconds = 0;
      started = false;

      timerDisplay.textContent = "00:00";
      movesDisplay.textContent = "0";
      pairsDisplay.textContent = "0/10";
      message.textContent = "Ayo mulai dan uji ingatanmu!";
      board.innerHTML = "";

      const cards = shuffle([...symbols, ...symbols]);

      cards.forEach((symbol, index) => {
        board.appendChild(createCard(symbol, index));
      });
    }

    restartButton.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
